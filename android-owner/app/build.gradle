plugins { id 'com.android.application' }
android {
 namespace 'it.dimoramia.owner'
 compileSdk 35
 defaultConfig { applicationId 'it.dimoramia.owner'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.2.0' }
 signingConfigs { release { if (System.getenv('DIMORA_KEYSTORE')) { storeFile file(System.getenv('DIMORA_KEYSTORE')); storePassword System.getenv('DIMORA_STORE_PASSWORD'); keyAlias 'dimora'; keyPassword System.getenv('DIMORA_KEY_PASSWORD') } } }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
 testOptions { unitTests.includeAndroidResources = true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation platform('com.google.firebase:firebase-bom:33.12.0'); implementation 'com.google.firebase:firebase-messaging'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }
tasks.withType(Test).configureEach {
 systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
 ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','javax.net.ssl.trustStore'].each { prop -> if (System.getProperty(prop)) systemProperty prop, System.getProperty(prop) }
}
